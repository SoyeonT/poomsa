<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🏯 소연샘과 함께하는 품사 방탈출 — 말의 비밀 서고</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css"> <!-- style.css로 스타일시트 추가 -->
</head>
<body class="text-gray-800">
<!-- 🏯 입장 인트로 오버레이 -->
<div id="introOverlay" class="fixed inset-0 bg-black/80 flex flex-col items-center justify-center text-center z-50 text-white">
 <!-- (교체) 서고 인라인 SVG -->
<div class="mb-6">
  <svg viewBox="0 0 1200 600"
       class="rounded-lg shadow-lg max-w-[80vw] max-h-[50vh] border border-gray-700">
    <!-- 배경 벽 -->
    <defs>
      <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#1f2937"/>
      </linearGradient>
      <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6b4f37"/><stop offset="1" stop-color="#4b3826"/>
      </linearGradient>
    </defs>
    <rect width="1200" height="600" fill="url(#bgGrad)"/>

    <!-- 책장 틀 -->
    <rect x="80" y="60" width="1040" height="480" rx="10" fill="url(#woodGrad)" stroke="#2b1c10" stroke-width="4"/>
    <!-- 칸막이 선 -->
    <g stroke="#2b1c10" stroke-width="3" opacity="0.6">
      <line x1="80"  y1="220" x2="1120" y2="220"/>
      <line x1="80"  y1="360" x2="1120" y2="360"/>
      <line x1="400" y1="60"  x2="400"  y2="540"/>
      <line x1="760" y1="60"  x2="760"  y2="540"/>
    </g>

    <!-- 책 더미 (랜덤 느낌) -->
    <g>
      <!-- 1행 -->
      <rect x="110" y="170" width="50" height="40" fill="#a7f3d0"/><rect x="164" y="160" width="36" height="50" fill="#93c5fd"/>
      <rect x="206" y="150" width="22" height="60" fill="#fca5a5"/><rect x="232" y="140" width="44" height="70" fill="#fde68a"/>
      <rect x="280" y="145" width="28" height="65" fill="#c4b5fd"/><rect x="312" y="165" width="38" height="45" fill="#fcd34d"/>
      <rect x="450" y="150" width="40" height="60" fill="#fdba74"/><rect x="494" y="160" width="30" height="50" fill="#bfdbfe"/>
      <rect x="528" y="140" width="52" height="70" fill="#86efac"/><rect x="584" y="165" width="24" height="45" fill="#fda4af"/>
      <rect x="820" y="160" width="46" height="50" fill="#fde68a"/><rect x="870" y="150" width="28" height="60" fill="#93c5fd"/>
      <rect x="902" y="140" width="40" height="70" fill="#a7f3d0"/><rect x="946" y="165" width="34" height="45" fill="#fca5a5"/>
    </g>

    <!-- 2행 -->
    <g>
      <rect x="110" y="300" width="36" height="50" fill="#fda4af"/><rect x="150" y="290" width="44" height="60" fill="#86efac"/>
      <rect x="198" y="315" width="26" height="35" fill="#c4b5fd"/><rect x="228" y="280" width="52" height="70" fill="#93c5fd"/>
      <rect x="284" y="305" width="28" height="45" fill="#fde68a"/><rect x="450" y="290" width="40" height="60" fill="#bfdbfe"/>
      <rect x="494" y="300" width="30" height="50" fill="#fdba74"/><rect x="528" y="280" width="44" height="70" fill="#a7f3d0"/>
      <rect x="576" y="305" width="26" height="45" fill="#fcd34d"/><rect x="820" y="300" width="46" height="50" fill="#93c5fd"/>
      <rect x="870" y="290" width="28" height="60" fill="#86efac"/><rect x="902" y="315" width="40" height="35" fill="#fca5a5"/>
      <rect x="946" y="280" width="34" height="70" fill="#fde68a"/>
    </g>

    <!-- 두루마리(스크롤) 몇 개 -->
    <g opacity="0.9">
      <rect x="660" y="430" width="90" height="12" rx="6" fill="#e5e7eb" stroke="#9ca3af"/>
      <circle cx="660" cy="436" r="6" fill="#9ca3af"/><circle cx="750" cy="436" r="6" fill="#9ca3af"/>
      <rect x="360" y="430" width="70" height="12" rx="6" fill="#e5e7eb" stroke="#9ca3af"/>
      <circle cx="360" cy="436" r="6" fill="#9ca3af"/><circle cx="430" cy="436" r="6" fill="#9ca3af"/>
    </g>

    <!-- 상단 표제 -->
    <text x="600" y="95" fill="#f8fafc" font-size="28" font-weight="700" text-anchor="middle" style="letter-spacing:.08em;">
      말의 비밀 서고
    </text>
  </svg>
</div>

  <h2 class="text-2xl font-bold mb-4">말의 비밀 서고</h2>
  <button id="enterBtn" class="btn primary text-lg px-6 py-3 text-black">입장하시겠습니까?</button>

  <!-- 비밀번호 입력창은 처음엔 숨김 -->
  <div id="pwArea" class="mt-4 hidden">
    <input id="pwInput" type="password" maxlength="4" placeholder="비밀번호 4자리" class="panel text-black w-40 text-center" />
    <button id="pwSubmit" class="btn primary ml-2 text-black">확인</button>
    <div id="pwFb" class="text-sm mt-2 text-rose-300"></div>
  </div>
</div>

<div class="max-w-5xl mx-auto p-4 md:p-6">
  <header class="mb-4">
    <h1 class="text-2xl md:text-3xl font-bold">🏯 소연샘과 함께하는 품사 방탈출 — 말의 비밀 서고</h1>
    <p class="text-sm text-gray-600 mt-1">중1 국어 · 품사 단원</p>
  </header>

  <!-- 선언문 -->
  <section class="mb-6">
    <h2 class="font-bold text-lg mb-2">📜 최종 선언문</h2>
    <div id="declaration" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2">
      <div class="slot panel text-center" data-slot="1" title="클릭하면 해당 문제로 이동">＿＿＿＿</div>
      <div class="slot panel text-center" data-slot="2" title="클릭하면 해당 문제로 이동">＿＿＿＿</div>
      <div class="slot panel text-center" data-slot="3" title="클릭하면 해당 문제로 이동">＿＿＿＿</div>
      <div class="slot panel text-center" data-slot="4" title="클릭하면 해당 문제로 이동">＿＿＿＿</div>
      <div class="slot panel text-center" data-slot="5" title="클릭하면 해당 문제로 이동">＿＿＿＿</div>
      <div class="slot panel text-center" data-slot="6" title="클릭하면 해당 문제로 이동">＿＿＿＿</div>
      <div class="slot panel text-center" data-slot="7" title="클릭하면 해당 문제로 이동">＿＿＿＿</div>
      <div class="slot panel text-center" data-slot="8" title="클릭하면 해당 문제로 이동">＿＿＿＿</div>
    </div>
    <p id="slotHint" class="text-xs text-gray-500 mt-2">※ 이미 공개된 조각만 클릭해서 재도전할 수 있어요.</p>
  </section>

  <!-- 라운드 헤더 -->
  <section class="mb-3">
    <div id="roundHeader" class="flex items-center justify-between">
      <h2 class="font-bold text-lg">🧩 라운드 <span id="roundNo">1</span> / 8</h2>
      <div id="roundActions" class="bar"></div>
    </div>
  </section>

  <!-- 문제 영역 -->
  <section id="problemArea" class="panel min-h-[260px]"></section>

  <!-- 풀이 기록 -->
  <section class="mt-6">
    <h2 class="font-bold text-lg mb-2">📌 문제별 결과</h2>
    <div id="results" class="space-y-2 text-sm"></div>
  </section>

  <footer class="text-m text-gray-500 mt-8">
    2025년 10월, 용강인의 즐거운 품사 공부를 위하여 소연샘이 만듦
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
